<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game Engine Editor</title>
  <link rel="stylesheet" href="style/main.css?v=8">
  <link rel="stylesheet" href="style/project-explorer.css?v=3">
  <link rel="stylesheet" href="style/viewers.css?v=2">
  <link rel="stylesheet" href="style/palette-editor.css?v=2">
  <link rel="stylesheet" href="style/tilemap-editor.css?v=1">
  <link rel="stylesheet" href="style/font-editor.css?v=3">
  <link rel="stylesheet" href="scripts/game-emulator/game-engine.css?v=4">
  <link rel="stylesheet" href="styles/mod-player.css?v=2">
  <link rel="stylesheet" href="style/ai-assistant.css?v=4">
  
  <!-- Monaco Editor -->
  <link rel="stylesheet" href="scripts/vendor/monaco-editor/vs/editor/editor.main.css">
</head>
<body>
  <!-- Loading overlay shown while Lua VM compiles -->
  <div id="appLoadingOverlay" class="app-loading-overlay">
    <div class="app-loading-content">
      <div class="app-loading-spinner"></div>
      <div class="app-loading-text">Loading Retro Studio…</div>
    </div>
  </div>

  <div class="editor-layout">
    <!-- Ribbon Toolbar -->
    <div class="ribbon-toolbar">
      <!-- File Operations Section -->
      <div class="ribbon-section" data-ribbon-group="file">
        <div class="ribbon-label">File</div>
        <div class="ribbon-file-primary-row">
          <button id="fileMenuToggle" class="ribbon-file-toggle" type="button" aria-haspopup="menu" aria-expanded="false" title="Open file options">
            <span class="ribbon-icon ribbon-file-toggle-icon">📄</span>
            <span class="ribbon-text ribbon-file-toggle-text">File</span>
          </button>
          <button id="saveBtn" class="ribbon-btn" title="Save Active File">
            <div class="ribbon-icon">💾</div>
            <div class="ribbon-text">Save</div>
          </button>
        </div>
        <div id="hostedSaveState" class="ribbon-save-state is-hidden" aria-live="polite" title="Hosted save status">
          <span class="ribbon-save-state-dot" aria-hidden="true"></span>
          <span id="hostedSaveStateLabel" class="ribbon-save-state-label">Saved</span>
        </div>
        <div class="ribbon-buttons">
          <button id="newProjectBtn" class="ribbon-btn" title="Create New Project">
            <div class="ribbon-icon">🧩</div>
            <div class="ribbon-text">New Project</div>
          </button>
          <button id="welcomeTabBtn" class="ribbon-btn" title="Open Welcome and recent projects tab">
            <div class="ribbon-icon">🏠</div>
            <div class="ribbon-text">Welcome</div>
          </button>
          <button id="examplesTabBtn" class="ribbon-btn" title="Open searchable examples tab">
            <div class="ribbon-icon">📚</div>
            <div class="ribbon-text">Examples</div>
          </button>
          <button id="saveRevisionBtn" class="ribbon-btn" title="Save a new cloud revision">
            <div class="ribbon-icon">🕘</div>
            <div class="ribbon-text">Save Revision</div>
          </button>
          <button id="idePreferencesBtn" class="ribbon-btn" title="Editor and IntelliSense preferences">
            <div class="ribbon-icon">⚙️</div>
            <div class="ribbon-text">IDE Preferences</div>
          </button>
          <button id="exportRwpBtn" class="ribbon-btn" title="Export Project (.rwp)">
            <div class="ribbon-icon">📦</div>
            <div class="ribbon-text">Export RWP</div>
          </button>
          <button id="importRwpBtn" class="ribbon-btn" title="Import Project (.rwp)">
            <div class="ribbon-icon">📥</div>
            <div class="ribbon-text">Import</div>
          </button>
          <button id="importP8Btn" class="ribbon-btn" title="Import PICO-8 Cart (.p8)">
            <div class="ribbon-icon">🕹️</div>
            <div class="ribbon-text">Import P8</div>
          </button>
        </div>
      </div>
      
      <!-- Create Objects Section -->
      <div class="ribbon-section" data-ribbon-group="create">
        <div class="ribbon-label">Create</div>
        <div class="ribbon-buttons">
          <!-- Dynamic buttons will be added here by the ribbon toolbar -->
        </div>
      </div>
      
      <!-- Project Build/Run Section -->
      <div class="ribbon-section" data-ribbon-group="project">
        <div class="ribbon-label">Project</div>
        <div class="ribbon-buttons">
          <button id="buildBtn" class="ribbon-btn" title="Build Project">
            <div class="ribbon-icon">🔨</div>
            <div class="ribbon-text">Build</div>
          </button>
          <button id="publishBtn" class="ribbon-btn" title="Store the .rws project and publish the .rwp draft to Retrowww">
            <div class="ribbon-icon">☁️</div>
            <div class="ribbon-text">Publish</div>
          </button>
          <button id="shareBtn" class="ribbon-btn" title="Create a temporary share link for this project">
            <div class="ribbon-icon">🔗</div>
            <div class="ribbon-text">Share</div>
          </button>
        </div>
      </div>

      <!-- Watch Section -->
      <div class="ribbon-section" data-ribbon-group="watch">
        <div class="ribbon-label">Watch</div>
        <div class="ribbon-buttons">
          <button id="watchLaunchBtn" class="ribbon-btn" title="Build and launch on watch">
            <div class="ribbon-icon">&#x1F680;</div>
            <div class="ribbon-text">Launch</div>
          </button>
        </div>
        <div id="watchProgress" class="watch-progress" style="display:none">
          <div class="watch-progress-bar"><div class="watch-progress-fill" id="watchProgressFill"></div></div>
          <div class="watch-progress-text" id="watchProgressText"></div>
        </div>
      </div>

      <!-- Assistant Section. Hidden until ai-assistant-panel.js loads, so the
           button cannot be clicked before there is anything behind it. -->
      <div class="ribbon-section" data-ribbon-group="assist" hidden>
        <div class="ribbon-label">Assistant</div>
        <div class="ribbon-buttons">
          <button id="aiAssistantBtn" class="ribbon-btn" title="Toggle the Lua assistant (needs your own Ollama server)">
            <div class="ribbon-icon">🤖</div>
            <div class="ribbon-text">Assistant</div>
          </button>
        </div>
      </div>

      <div class="ribbon-section ribbon-section-right ribbon-color-section" data-ribbon-group="color">
        <div class="ribbon-label">Color</div>
        <div class="ribbon-color-picker-row">
          <input id="ribbonColorPicker" class="ribbon-color-picker" type="color" value="#ffffff" title="Pick a color and copy it as 0xRRGGBB">
          <button id="ribbonColorCopyBtn" class="ribbon-color-copy" type="button" title="Copy color as 0xRRGGBB">
            <span id="ribbonColorValue">0xFFFFFF</span>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Content Area (Project Explorer + Main Content + Game Engine) -->
    <div class="content-wrapper">
      <!-- Project Explorer (left panel) -->
      <div class="project-explorer" id="projectExplorer">
        <div class="explorer-header">
          <h3>Project Explorer</h3>
          <button id="addFilesBtn" class="explorer-add-files-btn" title="Add files to project">
            <span>+</span> Add Files
          </button>
        </div>
        <div class="explorer-tree" id="projectTree">
          <!-- Tree will be populated by JavaScript -->
        </div>
      </div>
      
      <!-- Left Resizer -->
      <div class="resizer" id="resizer"></div>
      
      <!-- Main Content Area -->
      <div class="main-content" id="mainContent">
        <!-- Tabbed Viewer System -->
        <div class="viewer-container">
          <div class="tab-bar" id="tabBar">
            <div class="tab preview-tab active" data-tab-id="preview">
              <span class="tab-title">Preview</span>
              <span class="tab-close" data-action="close">×</span>
            </div>
          </div>
          
          <div class="tab-content-area" id="tabContentArea">
            <div class="tab-pane active" data-tab-id="preview">
              <div class="preview-pane">
                <div class="preview-header">
                  <h3>Welcome to Retro Studio</h3>
                  <p>Select a resource from the Project Explorer to preview it here, or double-click to open in a new tab.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Right Resizer -->
      <div class="game-engine-resizer" id="gameEngineResizer"></div>
      
      <!-- Game Engine Panel (right panel) -->
      <div class="game-engine-panel" id="gameEnginePanel">
        <div class="game-engine-header">
          <h3>Simulator</h3>
        </div>
        <div class="game-engine-content" id="gameEngineContent">
          <!-- Content will be rendered by game-emulator.js -->
        </div>
      </div>
    </div>
  </div>
  
  <!-- Context Menu -->
  
  <!-- Hidden file input for uploads -->
  <input type="file" id="fileUpload" multiple style="display: none;">
  
  <!-- Load scripts -->
  <!-- Core Architecture (must load first) -->
  <script src="scripts/core/service-container.js"></script>
  <script src="scripts/core/event-bus.js"></script>
  <script src="scripts/core/config-manager.js"></script>
  <script src="scripts/core/project-config-manager.js"></script>
    <script src="scripts/core/project-paths.js?v=5"></script>
  <script src="scripts/core/plugin-system.js"></script>
  <script src="scripts/core/component-registry.js"></script>
  <script src="scripts/core/service-adapters.js"></script>
  <script src="scripts/core/core-init.js"></script>
  
  <!-- External Dependencies (must load before services that use them) -->
  <!-- JSZip (vendored) for RWP import/export (ZIP with DEFLATE) -->
  <script src="scripts/vendor/jszip.min.js"></script>
  
  <!-- Graphics Utilities -->
  <script src="scripts/graphics/palette.js"></script>
  <script src="scripts/graphics/image.js"></script>
  <script src="scripts/graphics/d2-canvas.js"></script>
  <script src="scripts/graphics/d2-file.js"></script>
  <script src="scripts/graphics/d2-sprite.js"></script>
  <script src="scripts/tilemap/gid.js"></script>
  <script src="scripts/graphics/tilemap-gl-renderer.js"></script>
  
  <!-- Utilities and Services -->
  <script src="scripts/resizer.js"></script>
  <script src="scripts/file-io-service.js?v=11"></script>
  <script src="scripts/services/file-manager.js"></script>
  <script src="scripts/services/template-service.js"></script>
  <script src="scripts/services/template-catalog.js"></script>
  <script src="scripts/services/resource-pipeline.js"></script>
    <script src="scripts/services/rwp-service.js?v=8"></script>
  <script src="scripts/services/rwa-service.js?v=2"></script>
    <script src="scripts/lua/pico8-parser.js?v=4"></script>
    <script src="scripts/lua/pico8-font.js?v=4"></script>
  <script src="scripts/services/pico8-p8png.js?v=1"></script>
    <script src="scripts/services/pico8-import-service.js?v=20"></script>
  <script src="scripts/services/monaco-intellisense-service.js"></script>
  <script src="scripts/services/ai-assistant-service.js?v=7"></script>
  <script src="scripts/utils/modal-utils.js?v=3"></script>
  <script src="scripts/utils/editor-preferences.js?v=1"></script>
  <script src="scripts/utils/image-processor.js"></script>
  <script src="scripts/audio/pico-audio.js?v=2"></script>
  <script src="scripts/audio/audio-api.js?v=5"></script>
  <script src="scripts/audio/resource-manager.js?v=2"></script>
  
  <!-- External Audio Libraries -->
  <script src="scripts/audio/external/sfxr/sfxr.js"></script>
  
  <!-- UI Controls -->
  <script src="scripts/controls/play-pause-button.js"></script>
  <script src="scripts/controls/volume-control.js"></script>
  <script src="scripts/controls/loop-control.js"></script>
  
  <!-- Base classes (needed by editors) -->
  <script src="scripts/viewers/viewer-base.js"></script>
  
  <!-- Components -->
  <script src="scripts/components/waveform-display.js"></script>
  <script src="scripts/components/ai-assistant-panel.js?v=8"></script>
  
  <!-- Build System -->
  <script src="scripts/build-system.js?v=9"></script>
  <script src="scripts/builders/texture-builder.js?v=4"></script>
  <script src="scripts/builders/frameset-builder.js?v=1"></script>
  <script src="scripts/builders/sprite-builder.js?v=2"></script>
    <script src="scripts/builders/font-builder.js?v=4"></script>
  <script src="scripts/builders/tilemap-builder.js?v=1"></script>
  <script src="scripts/builders/music-builder.js?v=1"></script>
  
  <!-- Interfaces -->
  <script src="scripts/interfaces/registerable.js"></script>
  <script src="scripts/interfaces/buildable.js"></script>
  
  <!-- Editors (base classes only - actual editors loaded dynamically) -->
  <script src="scripts/editors/editor-base.js?v=1"></script>
  <script src="scripts/editors/compound-editor.js"></script>
  
  <!-- UI Management -->
    <script src="scripts/ribbon-toolbar.js?v=11"></script>
  <script src="scripts/tab-manager.js?v=5"></script>
  <script src="scripts/project-explorer.js?v=13"></script>
  <script src="scripts/game-emulator/simulator-logger.js?v=2"></script>
  <script src="scripts/game-emulator/game-emulator.js?v=19"></script>
  <script src="scripts/game-emulator/embedded-runtime-player.js?v=3"></script>
  <script src="scripts/game-emulator/runtime-host.js?v=2"></script>

  <!-- BLE Watch Client -->
  <script src="test/retrowatch-ble-client-v2.js"></script>
  
  <!-- Application Bootstrap (components will be loaded dynamically after init) -->
  <script src="scripts/core/application.js?v=7"></script>
  
  <!-- Monaco Editor (load after everything else) -->
  <script src="scripts/vendor/monaco-editor/vs/loader.js"></script>
  <script>
    require.config({ paths: { vs: 'scripts/vendor/monaco-editor/vs' } });
    require(['vs/editor/editor.main'], function() {
      console.log('[Monaco] Monaco Editor loaded successfully');
    });
  </script>
</body>
</html>
