<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMX Map Viewer & Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
      display: flex;
      height: 100vh;
    }
    
    .container {
      display: flex;
      width: 100%;
      height: 100%;
    }
    
    .sidebar {
      width: 280px;
      background: #252526;
      border-right: 1px solid #3e3e42;
      overflow-y: auto;
      padding: 15px;
    }
    
    .sidebar h3 {
      margin-top: 15px;
      margin-bottom: 10px;
      color: #4ec9b0;
      font-size: 13px;
      text-transform: uppercase;
    }
    
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .toolbar {
      background: #2d2d30;
      border-bottom: 1px solid #3e3e42;
      padding: 10px 15px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    button {
      background: #007acc;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #005a9e; }
    button:active { background: #004578; }
    button.active { background: #f44747; }
    
    input[type="file"] { display: none; }
    
    .canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1e1e;
      overflow: auto;
      position: relative;
    }
    
    canvas {
      background: #0a0a0a;
      border: 2px solid #3e3e42;
      cursor: crosshair;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    
    .info-panel {
      background: #2d2d30;
      border-top: 1px solid #3e3e42;
      padding: 10px 15px;
      font-size: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }
    
    .info-item {
      display: flex;
      flex-direction: column;
    }
    
    .info-label {
      color: #858585;
      font-size: 11px;
      text-transform: uppercase;
    }
    
    .info-value {
      color: #4ec9b0;
      font-weight: bold;
    }
    
    .tile-palette {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 10px;
    }
    
    .tile-btn {
      width: 40px;
      height: 40px;
      border: 2px solid #3e3e42;
      background: #0a0a0a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #858585;
    }
    
    .tile-btn:hover {
      border-color: #4ec9b0;
    }
    
    .tile-btn.selected {
      border-color: #f44747;
      background: rgba(244, 71, 71, 0.1);
    }
    
    .status {
      background: #252526;
      padding: 8px 15px;
      font-size: 11px;
      color: #858585;
      border-top: 1px solid #3e3e42;
    }
    
    .error {
      background: #3d2222;
      color: #f48771;
      padding: 10px;
      border-radius: 3px;
      margin: 10px 0;
    }
    
    .success {
      background: #1b3d1b;
      color: #84d984;
      padding: 10px;
      border-radius: 3px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
      <h3>📂 File</h3>
      <button onclick="document.getElementById('fileInput').click()">Open TMX...</button>
      <input type="file" id="fileInput" accept=".tmx" onchange="handleFileSelect(event)">
      
      <button onclick="exportTMX()" style="background: #107c10;">Export TMX</button>
      
      <div id="fileInfo"></div>
      
      <h3>🎨 Tools</h3>
      <button id="toolPaint" class="active" onclick="selectTool('paint')">Paint</button>
      <button id="toolFill" onclick="selectTool('fill')">Fill</button>
      <button id="toolErase" onclick="selectTool('erase')">Erase</button>
      
      <h3>🎨 Tilesets</h3>
      <div id="tilesetsList" style="font-size: 11px; margin-top: 10px;"></div>
      
      <h3>📐 Layers</h3>
      <div id="layersList"></div>
      
      <h3>🎭 Tiles</h3>
      <div id="tilePalette"></div>
    </div>
    
    <!-- MAIN AREA -->
    <div class="main">
      <!-- TOOLBAR -->
      <div class="toolbar">
        <label>
          Map:
          <select id="mapSelector" onchange="loadMap(this.value)" style="background: #3e3e42; color: #d4d4d4; padding: 4px; border: 1px solid #3e3e42;">
            <option value="">Choose example...</option>
            <optgroup label="Demo Maps">
              <option value="sample-map.tmx">Sample (12×10)</option>
              <option value="examples-outdoor.tmx">Outdoor (20×15)</option>
              <option value="examples-dungeon.tmx">Dungeon (16×12)</option>
              <option value="example-forest.tmx">Forest (32×24)</option>
              <option value="example-cave.tmx">Cave (28×20)</option>
              <option value="example-village.tmx">Village (40×30)</option>
            </optgroup>
            <optgroup label="Real Tiled Files">
              <option value="tiled-orthogonal-outside.tmx">Tiled: Orthogonal Outside (45×31)</option>
              <option value="tiled-desert.tmx">Tiled: Desert (40×40)</option>
            </optgroup>
          </select>
        </label>
        <span style="flex: 1;"></span>
        <button onclick="resetZoom()">Fit View</button>
        <span id="zoomLevel">100%</span>
      </div>
      
      <!-- CANVAS -->
      <div class="canvas-container" id="canvasContainer">
        <canvas id="canvas"></canvas>
      </div>
      
      <!-- STATUS BAR -->
      <div class="info-panel">
        <div class="info-item">
          <span class="info-label">Map Size</span>
          <span class="info-value" id="mapSize">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">Cursor</span>
          <span class="info-value" id="cursor">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">Selected Tile</span>
          <span class="info-value" id="selectedTile">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">Current Layer</span>
          <span class="info-value" id="currentLayer">—</span>
        </div>
      </div>
      
      <!-- STATUS -->
      <div class="status" id="status">Ready. Load a TMX file to begin.</div>
    </div>
  </div>

  <script src="tilemap-importer.js"></script>
  <script>
    // Global state
    let mapData = null;
    let canvas = null;
    let ctx = null;
    let currentTool = 'paint';
    let selectedTile = 1;
    let currentLayer = 0;
    let zoom = 2;
    let panX = 0;
    let panY = 0;
    
    // Colors for different tile IDs (simple palette)
    const tileColors = {
      0: '#000000', // empty
      1: '#442222', // wall/brown
      2: '#884444', // stone
      3: '#aa6644', // dirt
      4: '#44aa44', // grass
      5: '#22aa22', // grass2
      6: '#00aa00', // grass3
      7: '#0088aa', // water
      8: '#0066ff', // water2
      9: '#ffcc00', // gold/sand
      10: '#ffffff', // light
    };
    
    function init() {
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');
      
      canvas.addEventListener('click', handleCanvasClick);
      canvas.addEventListener('mousemove', handleCanvasMouseMove);
      canvas.addEventListener('wheel', handleCanvasWheel, { passive: false });
      canvas.addEventListener('contextmenu', e => e.preventDefault());
    }
    
    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const text = await file.text();
      try {
        mapData = TMXImporter.parse(text);
        mapData.filename = file.name;
        renderMap();
        updateUI();
        updateStatus(`✓ Loaded: ${file.name}`);
      } catch (e) {
        updateStatus(`✗ Error: ${e.message}`, true);
      }
    }
    
    async function loadMap(filename) {
      if (!filename) return;
      
      try {
        window.loadedTilesets = {}; // Reset tilesets
        const response = await fetch(filename);
        if (!response.ok) throw new Error(`File not found: ${filename}`);
        
        const text = await response.text();
        mapData = TMXImporter.parse(text);
        mapData.filename = filename;
        renderMap();
        updateUI();
        updateStatus(`✓ Loaded: ${filename}`);
      } catch (e) {
        updateStatus(`✗ Error: ${e.message}`, true);
      }
    }
    
    async function renderMap() {
      if (!mapData) return;
      
      const map = mapData.map;
      const tileWidth = map.tileWidth;
      const tileHeight = map.tileHeight;
      const width = map.width;
      const height = map.height;
      
      canvas.width = width * tileWidth * zoom;
      canvas.height = height * tileHeight * zoom;
      
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Generate tilesets if not already loaded
      if (!window.loadedTilesets) {
        window.loadedTilesets = {};
        for (const ts of mapData.tilesets) {
          // Try to load from file if available
          if (ts.image && ts.image.source) {
            try {
              const img = new Image();
              img.src = ts.image.source;
              img.onload = () => {
                window.loadedTilesets[ts.firstGid] = {
                  image: img,
                  tileset: ts,
                  isFile: true
                };
                updateStatus(`✓ Loaded tileset: ${ts.image.source}`);
                renderMap(); // Re-render with loaded graphics
              };
              img.onerror = () => {
                // File not found, generate placeholder
                generateTilesetCanvas(ts);
              };
              // Set timeout to generate if load takes too long
              setTimeout(() => {
                if (!window.loadedTilesets[ts.firstGid]) {
                  generateTilesetCanvas(ts);
                }
              }, 500);
            } catch (e) {
              generateTilesetCanvas(ts);
            }
          } else {
            generateTilesetCanvas(ts);
          }
        }
      }
      
      // Draw current layer
      if (mapData.layers[currentLayer]) {
        const layer = mapData.layers[currentLayer];
        for (let y = 0; y < layer.height; y++) {
          for (let x = 0; x < layer.width; x++) {
            const tileId = layer.data[y * layer.width + x];
            
            if (tileId > 0) {
              // Find which tileset this tile belongs to
              let tileset = null;
              let localTileId = tileId;
              
              for (let i = mapData.tilesets.length - 1; i >= 0; i--) {
                if (tileId >= mapData.tilesets[i].firstGid) {
                  tileset = mapData.tilesets[i];
                  localTileId = tileId - mapData.tilesets[i].firstGid;
                  break;
                }
              }
              
              const screenX = x * tileWidth * zoom;
              const screenY = y * tileHeight * zoom;
              const screenW = tileWidth * zoom;
              const screenH = tileHeight * zoom;
              
              // Try to draw from tileset
              const loaded = window.loadedTilesets[tileset.firstGid];
              if (loaded && loaded.image) {
                const ts = tileset;
                const col = localTileId % ts.columns;
                const row = Math.floor(localTileId / ts.columns);
                const srcX = col * ts.tileWidth;
                const srcY = row * ts.tileHeight;
                
                try {
                  ctx.drawImage(
                    loaded.image,
                    srcX, srcY, ts.tileWidth, ts.tileHeight,
                    screenX, screenY, screenW, screenH
                  );
                } catch (e) {
                  // Fallback to color
                  ctx.fillStyle = tileColors[tileId % 11] || '#333333';
                  ctx.fillRect(screenX, screenY, screenW, screenH);
                }
              } else {
                // Fallback to color
                ctx.fillStyle = tileColors[tileId % 11] || '#333333';
                ctx.fillRect(screenX, screenY, screenW, screenH);
              }
            }
            
            // Draw grid
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 1;
            ctx.strokeRect(
              x * tileWidth * zoom,
              y * tileHeight * zoom,
              tileWidth * zoom,
              tileHeight * zoom
            );
          }
        }
      }
    }
    
    function generateTilesetCanvas(tileset) {
      // Create a canvas-based placeholder tileset
      const tileCount = tileset.tileCount || 256;
      const cols = tileset.columns || 16;
      const rows = Math.ceil(tileCount / cols);
      
      const canvas = document.createElement('canvas');
      canvas.width = cols * tileset.tileWidth;
      canvas.height = rows * tileset.tileHeight;
      const ctx = canvas.getContext('2d');
      
      // Fill with semi-random tile patterns
      const tileColors2 = ['#2a2a2a', '#4a4a4a', '#6a6a6a', '#8a8a8a', 
                            '#3d5a3d', '#5a7a5a', '#7a9a7a', '#8ab08a',
                            '#3a4a7a', '#4a6a9a', '#5a8aba', '#7aaacd'];
      
      for (let i = 0; i < tileCount; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const x = col * tileset.tileWidth;
        const y = row * tileset.tileHeight;
        
        // Use tile ID to pick color and pattern
        const baseColor = tileColors2[i % tileColors2.length];
        ctx.fillStyle = baseColor;
        ctx.fillRect(x, y, tileset.tileWidth, tileset.tileHeight);
        
        // Add subtle pattern
        ctx.fillStyle = tileColors2[(i + 1) % tileColors2.length];
        if (i % 3 === 0) {
          ctx.fillRect(x + 1, y + 1, tileset.tileWidth - 2, tileset.tileHeight - 2);
        }
        
        // Border
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, tileset.tileWidth, tileset.tileHeight);
      }
      
      window.loadedTilesets[tileset.firstGid] = {
        image: canvas,
        tileset: tileset,
        isGenerated: true
      };
      
      updateStatus(`⚠ Generated placeholder tileset: ${tileset.name}`);
      renderMap(); // Re-render with generated graphics
    }
    
    function handleCanvasClick(e) {
      if (!mapData) return;
      
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / (mapData.map.tileWidth * zoom));
      const y = Math.floor((e.clientY - rect.top) / (mapData.map.tileHeight * zoom));
      
      if (x < 0 || x >= mapData.map.width || y < 0 || y >= mapData.map.height) return;
      
      const layer = mapData.layers[currentLayer];
      const idx = y * layer.width + x;
      
      if (currentTool === 'paint') {
        layer.data[idx] = selectedTile;
      } else if (currentTool === 'erase') {
        layer.data[idx] = 0;
      } else if (currentTool === 'fill') {
        floodFill(x, y, layer.data[idx], selectedTile);
      }
      
      renderMap();
    }
    
    function handleCanvasMouseMove(e) {
      if (!mapData) return;
      
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / (mapData.map.tileWidth * zoom));
      const y = Math.floor((e.clientY - rect.top) / (mapData.map.tileHeight * zoom));
      
      document.getElementById('cursor').textContent = `(${x}, ${y})`;
    }
    
    function handleCanvasWheel(e) {
      e.preventDefault();
      
      if (e.deltaY < 0) {
        zoom = Math.min(zoom + 1, 8);
      } else {
        zoom = Math.max(zoom - 1, 1);
      }
      
      document.getElementById('zoomLevel').textContent = `${zoom * 100}%`;
      renderMap();
    }
    
    function floodFill(x, y, oldTile, newTile) {
      if (oldTile === newTile) return;
      
      const layer = mapData.layers[currentLayer];
      const stack = [[x, y]];
      
      while (stack.length > 0) {
        const [cx, cy] = stack.pop();
        
        if (cx < 0 || cx >= layer.width || cy < 0 || cy >= layer.height) continue;
        
        const idx = cy * layer.width + cx;
        if (layer.data[idx] !== oldTile) continue;
        
        layer.data[idx] = newTile;
        stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
      }
    }
    
    function selectTool(tool) {
      currentTool = tool;
      document.querySelectorAll('[id^="tool"]').forEach(el => el.classList.remove('active'));
      document.getElementById(`tool${tool.charAt(0).toUpperCase() + tool.slice(1)}`).classList.add('active');
    }
    
    function updateUI() {
      if (!mapData) return;
      
      // Map info
      const map = mapData.map;
      document.getElementById('mapSize').textContent = `${map.width} × ${map.height}`;
      document.getElementById('currentLayer').textContent = mapData.layers[currentLayer]?.name || '—';
      document.getElementById('selectedTile').textContent = `#${selectedTile}`;
      
      // Layers
      const layersList = document.getElementById('layersList');
      layersList.innerHTML = '';
      mapData.layers.forEach((layer, i) => {
        const btn = document.createElement('button');
        btn.textContent = layer.name;
        btn.style.marginBottom = '5px';
        if (i === currentLayer) btn.classList.add('active');
        btn.onclick = () => {
          currentLayer = i;
          updateUI();
          renderMap();
        };
        layersList.appendChild(btn);
      });
      
      // Tiles
      const palette = document.getElementById('tilePalette');
      palette.innerHTML = '';
      for (let id = 0; id <= 10; id++) {
        const btn = document.createElement('div');
        btn.className = 'tile-btn';
        if (id === selectedTile) btn.classList.add('selected');
        btn.style.background = tileColors[id] || '#333333';
        btn.textContent = id;
        btn.onclick = () => {
          selectedTile = id;
          updateUI();
        };
        palette.appendChild(btn);
      }
      
      // Tilesets status
      const tilesetsList = document.getElementById('tilesetsList');
      if (mapData && mapData.tilesets && mapData.tilesets.length > 0) {
        let html = '';
        mapData.tilesets.forEach(ts => {
          const isLoaded = window.loadedTilesets && window.loadedTilesets[ts.firstGid];
          const status = isLoaded ? '✓' : '✗';
          const source = ts.image?.source || '(no image)';
          html += `<div style="padding: 5px; background: ${isLoaded ? '#1b3d1b' : '#3d2222'}; margin: 3px 0; border-radius: 3px;">
            <div style="color: ${isLoaded ? '#84d984' : '#f48771'}">${status} ${ts.name}</div>
            <div style="font-size: 10px; color: #858585;">${source}</div>
          </div>`;
        });
        tilesetsList.innerHTML = html;
      }
      
      // File info
      document.getElementById('fileInfo').innerHTML = mapData.filename ? 
        `<div style="margin-top: 10px; padding: 10px; background: #1e1e1e; border-radius: 3px;">
          <div style="font-size: 11px; color: #858585;">Current File</div>
          <div style="color: #4ec9b0; font-weight: bold; font-size: 12px;">${mapData.filename}</div>
        </div>` : '';
    }
    
    function resetZoom() {
      zoom = 2;
      document.getElementById('zoomLevel').textContent = `${zoom * 100}%`;
      renderMap();
    }
    
    function exportTMX() {
      if (!mapData) {
        updateStatus('No map loaded', true);
        return;
      }
      
      // Generate TMX XML
      let tmx = '<?xml version="1.0" encoding="UTF-8"?>\n';
      tmx += `<map version="1.10" width="${mapData.map.width}" height="${mapData.map.height}" tilewidth="${mapData.map.tileWidth}" tileheight="${mapData.map.tileHeight}">\n`;
      
      // Tilesets
      mapData.tilesets.forEach(ts => {
        tmx += `  <tileset firstgid="${ts.firstGid}" name="${ts.name}" tilewidth="${ts.tileWidth}" tileheight="${ts.tileHeight}" tilecount="${ts.tileCount}" columns="${ts.columns}">\n`;
        if (ts.image) {
          tmx += `    <image source="${ts.image.source}" width="${ts.image.width}" height="${ts.image.height}"/>\n`;
        }
        tmx += `  </tileset>\n`;
      });
      
      // Layers
      mapData.layers.forEach(layer => {
        tmx += `  <layer name="${layer.name}" width="${layer.width}" height="${layer.height}">\n`;
        tmx += `    <data encoding="csv">\n`;
        tmx += layer.data.map((t, i) => (i % layer.width === 0 && i > 0 ? '\n' : '') + t).join(',');
        tmx += `\n    </data>\n`;
        tmx += `  </layer>\n`;
      });
      
      tmx += `</map>`;
      
      // Download
      const blob = new Blob([tmx], { type: 'application/xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (mapData.filename || 'map') + '.tmx';
      a.click();
      URL.revokeObjectURL(url);
      
      updateStatus(`✓ Exported: ${a.download}`);
    }
    
    function updateStatus(msg, isError = false) {
      const status = document.getElementById('status');
      status.textContent = msg;
      status.style.background = isError ? '#3d2222' : '#252526';
      status.style.color = isError ? '#f48771' : '#d4d4d4';
    }
    
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
